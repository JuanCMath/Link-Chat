version: '3.8'

# Multi-container setup for testing Link-Chat communication
# Creates a virtual network with two Link-Chat instances

services:
  # Node 1 - Alice
  alice:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkchat:latest
    container_name: linkchat-alice
    hostname: alice
    
    # Use bridge network for container-to-container communication
    networks:
      linkchat-net:
        ipv4_address: 172.20.0.10
    
    # Required capabilities for raw sockets
    cap_add:
      - NET_RAW
      - NET_ADMIN
    
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - QT_QPA_PLATFORM=offscreen  # Headless mode for Windows
      - INTERFACE=eth0  # Container's virtual interface
      - NODE_NAME=Alice
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ./downloads-alice:/app/downloads
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # Linux X11 (optional)
    
    stdin_open: true
    tty: true
    
    command: python -m linkchat.app.qt_main
  
  # Node 2 - Bob
  bob:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkchat:latest
    container_name: linkchat-bob
    hostname: bob
    
    networks:
      linkchat-net:
        ipv4_address: 172.20.0.11
    
    cap_add:
      - NET_RAW
      - NET_ADMIN
    
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - QT_QPA_PLATFORM=offscreen
      - INTERFACE=eth0
      - NODE_NAME=Bob
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ./downloads-bob:/app/downloads
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    
    stdin_open: true
    tty: true
    
    command: python -m linkchat.app.qt_main

networks:
  linkchat-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
