name: linkchat_mobile
description: Link-Chat Mobile — mensajería P2P cifrada por WiFi/LAN.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Identidad y persistencia
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Red
  network_info_plus: ^5.0.3
  permission_handler: ^11.3.1

  # Criptografía (X25519 + ChaCha20-Poly1305 + HKDF)
  cryptography: ^2.7.0

  # Archivos
  file_picker: ^8.0.6

  # Estado
  provider: ^6.1.2

  # Utilidades
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
